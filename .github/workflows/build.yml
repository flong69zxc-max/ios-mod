name: Build iOS dylib

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compile to dylib (arm64 iOS)
        run: |
          # Компилируем C++ с правильными флагами
          xcrun -sdk iphoneos clang++ \
            -arch arm64 \
            -dynamiclib \
            -framework Foundation \
            -framework UIKit \
            -stdlib=libc++ \
            -std=c++17 \
            -O3 \
            -o mylib.dylib \
            main.mm
          
          # Проверяем
          echo "✅ Dylib создан:"
          ls -la mylib.dylib
          file mylib.dylib
          lipo -info mylib.dylib

      - name: Upload built dylib
        uses: actions/upload-artifact@v4
        with:
          name: mylib
          path: mylib.dylib
