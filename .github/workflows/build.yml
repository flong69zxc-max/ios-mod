name: Build Raw .dylib for iOS

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v4

    - name: Build dylib via Makefile
      run: |
        xcodebuild -create-xcframework \
          -library build/libMyLib.dylib \
          -headers include \
          -output MyLib.xcframework

    - name: Extract raw dylib
      run: |
        cp build/Release-iphoneos/libMyLib.dylib ./MyLib.dylib

    - name: Sign dylib with ad-hoc
      run: |
        codesign -f -s - ./MyLib.dylib

    - name: Upload .dylib
      uses: actions/upload-artifact@v4
      with:
        name: Tweak.dylib
        path: Tweak.dylib
