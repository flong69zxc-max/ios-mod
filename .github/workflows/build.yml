name: Build HitboxEngine.dylib

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:  # Позволяет запускать вручную

jobs:
  build:
    name: Build iOS dylib
    runs-on: macos-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Setup Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: latest-stable

    - name: Install dependencies
      run: |
        brew install ldid
        gem install xcodeproj

    - name: Create Xcode project
      run: |
        python3 create_project.py

    - name: Build dylib
      run: |
        chmod +x build.sh
        ./build.sh

    - name: Sign and strip
      run: |
        # Стриппим символы
        strip -Sx build/Release-iphoneos/HitboxEngine.dylib
        
        # Подписываем для iOS
        ldid -S build/Release-iphoneos/HitboxEngine.dylib
        
        # Проверяем зависимости
        otool -L build/Release-iphoneos/HitboxEngine.dylib

    - name: Upload artifact
      uses: actions/upload-artifact@v3
      with:
        name: HitboxEngine
        path: |
          build/Release-iphoneos/HitboxEngine.dylib
          build/Release-iphoneos/HitboxEngine.dylib.dSYM
        retention-days: 30

    - name: Create release
      if: github.ref == 'refs/heads/main'
      uses: softprops/action-gh-release@v1
      with:
        tag_name: v1.0.${{ github.run_number }}
        name: HitboxEngine v1.0.${{ github.run_number }}
        files: |
          build/Release-iphoneos/HitboxEngine.dylib
          build/Release-iphoneos/HitboxEngine.dylib.dSYM
        draft: false
        prerelease: false
