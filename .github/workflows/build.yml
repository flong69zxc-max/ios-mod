name: Build iOS dylib

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compile all modules
        run: |
          echo "🔨 Building modules..."
          
          echo "📦 Building hitbox.dylib..."
          xcrun -sdk iphoneos clang++ -arch arm64 -dynamiclib \
            -framework Foundation -framework UIKit \
            -stdlib=libc++ -std=c++17 -O3 \
            -o hitbox.dylib main.mm
          
          echo "📦 Building antikick.dylib..."
          xcrun -sdk iphoneos clang -arch arm64 -dynamiclib \
            -framework Foundation -framework UIKit -framework AVFoundation \
            -O3 -o antikick.dylib antikick.mm
          
          echo "📦 Building norelpatch.dylib..."
          xcrun -sdk iphoneos clang -arch arm64 -dynamiclib \
            -framework Foundation -framework UIKit \
            -O3 -o norelpatch.dylib norelpatch.mm -lz
          
          echo ""
          echo "✅ All modules built:"
          ls -la *.dylib

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: modules
          path: |
            hitbox.dylib
            antikick.dylib
            norelpatch.dylib
