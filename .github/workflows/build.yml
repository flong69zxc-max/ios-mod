name: Build Pure Dylib

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: angelxwind/theos:latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Build project
        run: make

      - name: Collect dylib and plist
        run: |
          mkdir -p compiled
          find .theos/obj -name "*.dylib" -exec cp {} compiled/ \;
          find .theos/obj -name "*.plist" -exec cp {} compiled/ \;
          ls -la compiled/

      - name: Upload Dylib Artifact
        uses: actions/upload-artifact@v3
        with:
          name: LowPowerMock-Dylib
          path: compiled/*
